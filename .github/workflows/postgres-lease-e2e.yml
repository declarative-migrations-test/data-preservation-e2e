name: postgres lease and convergence certification

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "47 7 * * *"

permissions:
  contents: read

concurrency:
  group: postgres-lease-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out the exact product head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: declarative-migrations/declarative-postgres-migrate.rs
          ref: 21882db2896628707a2e8601c7bf2c1b1ed8454c
          path: upstream
          persist-credentials: false
          show-progress: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: upstream -> target
      - name: Prove single ownership, release, and reacquisition
        working-directory: upstream
        env:
          DPM_TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
        run: cargo test --locked --test lease_contract -- --test-threads=1 --nocapture
      - name: Re-run the lease witness to catch lifecycle leakage
        working-directory: upstream
        env:
          DPM_TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
        run: |
          for attempt in 1 2 3 4 5; do
            echo "lease lifecycle attempt ${attempt}"
            cargo test --locked --test lease_contract -- --test-threads=1
          done
      - name: Run the full PostgreSQL convergence suite
        working-directory: upstream
        env:
          DPM_TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
        run: cargo test --locked --test convergence -- --test-threads=4
